<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaptionBridge — Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <h1>CaptionBridge Admin</h1>
  <div id="warning-banner" class="banner" hidden></div>

  <p><a href="/admin/setup">First-boot setup wizard →</a></p>

  <!-- Captions and audio readiness are reported SEPARATELY (§2 asymmetry, §8.2):
       you can have perfect captions and a dead VI feed, or clean HI audio and no
       captions. -->
  <section class="tiles">
    <div class="tile" id="caption-tile">
      <h2>Captions <span class="verdict" id="caption-verdict">—</span></h2>
      <dl id="caption-detail"></dl>
    </div>
    <div class="tile" id="audio-tile">
      <h2>Audio <span class="verdict" id="audio-verdict">—</span></h2>
      <div id="audio-detail"></div>
    </div>
    <div class="tile" id="net-tile">
      <h2>Network &amp; security</h2>
      <dl id="net-detail"></dl>
    </div>
  </section>

  <script src="/static/admin.js"></script>
</body>
</html>
