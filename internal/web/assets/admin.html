<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaptionBridge — Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <!-- §8.4: admin reachable over the patron network exists ONLY in Lab and Booth
       Diagnostic and ONLY behind a prominent warning banner. The deploy profile
       carries WarningBanner for exactly this; this element is where it lands. -->
  <div id="deploy-banner" class="banner deploy" hidden></div>

  <header class="head">
    <h1>CaptionBridge <span class="room" id="room"></span></h1>
    <p class="muted" id="profile-line">&nbsp;</p>
  </header>

  <!-- §8.3: the dashboard must SHOUT, not whisper. -->
  <div id="warning-banner" class="banner" hidden></div>

  <!-- §10.6: two INDEPENDENT top-line verdicts. Captions and audio are never
       merged into one health light — a room can have perfect captions and a dead
       VI feed, or clean HI audio and no captions. -->
  <section class="verdicts">
    <div class="bigverdict" id="caption-big">
      <span class="label">Captions</span>
      <strong class="value" id="caption-verdict">—</strong>
      <span class="why muted" id="caption-why"></span>
    </div>
    <div class="bigverdict" id="audio-big">
      <span class="label">Audio</span>
      <strong class="value" id="audio-verdict">—</strong>
      <span class="why muted" id="audio-why"></span>
    </div>
  </section>

  <!-- The §8.2 rows, grouped the way a booth tech reads them. -->
  <section class="tiles">
    <div class="tile">
      <h2>Caption path</h2>
      <dl id="caption-detail"></dl>
    </div>
    <div class="tile">
      <h2>Cinema server <span class="tag" id="identity-tag"></span></h2>
      <dl id="server-detail"></dl>
    </div>
    <div class="tile">
      <h2>Audio streams</h2>
      <div id="audio-detail"></div>
    </div>
    <div class="tile">
      <h2>Network &amp; security</h2>
      <dl id="net-detail"></dl>
    </div>
    <div class="tile">
      <h2>Processes <span class="muted small">(§3.5)</span></h2>
      <dl id="process-detail"></dl>
    </div>
    <div class="tile">
      <h2>Appliance <span class="muted small">(§10.8)</span></h2>
      <dl id="version-detail"></dl>
    </div>
    <!-- §9.4 support mode: the only way back in once SSH is off, so the state of
         that way in is spelled out rather than shown as a toggle. -->
    <div class="tile">
      <h2>Support session <span class="muted small">(§9.4)</span></h2>
      <dl id="support-detail"></dl>
      <p class="muted small" id="support-note"></p>
      <div class="session-actions">
        <input type="text" id="support-reason" placeholder="Reason (recorded, required)" maxlength="200">
        <button type="button" id="support-open">Open a support window</button>
        <button type="button" id="support-close">Close it</button>
      </div>
      <dl id="support-trail"></dl>
    </div>
    <!-- §11.5 staff pre-show gate. The printable form is the one that matters:
         it goes in a binder and survives the appliance being what is broken. -->
    <div class="tile">
      <h2>Pre-show checklist <span class="muted small">(§11.5)</span></h2>
      <p id="checklist-summary" class="muted"></p>
      <dl id="checklist-detail"></dl>
      <p><a id="checklist-print" href="/api/admin/preshow?format=text" target="_blank" rel="noopener">Printable sheet for the booth →</a></p>
    </div>
    <!-- §10.4 per-show patron access. The QR is a bearer credential for the
         show, which is why it only ever appears on this listener (§8.4). -->
    <div class="tile">
      <h2>This show's patron access <span class="muted small">(§10.4)</span></h2>
      <div id="session-qr-wrap" hidden>
        <img id="session-qr" alt="QR code a patron scans to join this show" width="244" height="244">
      </div>
      <dl id="session-detail"></dl>
      <div class="session-actions">
        <button type="button" id="session-issue">Start a new show</button>
        <button type="button" id="session-end">End the show</button>
      </div>
      <p class="muted small" id="session-note"></p>
    </div>
  </section>

  <footer class="foot">
    <a href="/admin/setup">First-boot setup wizard →</a>
    <span class="muted small" id="refreshed">&nbsp;</span>
  </footer>

  <script src="/static/admin.js"></script>
</body>
</html>
