name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify modules tidy
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The full suite includes the ST 430-10 simulator scenario suite — the
      # caption-path regression backbone (§11.1) — and the security/invariant
      # tests (§11.6). These run headless on every push/PR.
      - name: Test (race)
        run: go test -race ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt | tail -1

      - name: Build all binaries
        run: |
          # Build through make so the §9.4 build number is stamped in. A binary
          # built without it refuses to judge an update rather than guessing
          # which way to fail (D32, buildinfo.BuildNumber).
          make build
