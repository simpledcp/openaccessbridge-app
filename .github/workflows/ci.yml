name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the §9.4 build number is the commit count (Makefile),
          # and a shallow clone would stamp every CI binary as build 1.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify modules tidy
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The full suite includes the ST 430-10 simulator scenario suite — the
      # caption-path regression backbone (§11.1) — and the security/invariant
      # tests (§11.6). These run headless on every push/PR.
      - name: Test (race)
        run: go test -race ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt | tail -1

      - name: Build all binaries
        run: |
          # Build through make so the §9.4 build number is stamped in. A binary
          # built without it refuses to judge an update rather than guessing
          # which way to fail (D32, buildinfo.BuildNumber).
          make build

  # The container image (deploy/docker, D45): built with the same stamps as the
  # native binaries, then proven by the smoke test — the three-container stack
  # comes up healthy across container boundaries, the surfaces serve, the
  # single-container demo stops cleanly, and nothing logs an error.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner's own Docker (BuildKit, `docker` driver) is used on purpose:
      # a docker-container builder would not load the image into the daemon the
      # smoke test runs it from.
      - name: Build the image and run the container smoke test
        run: make docker-smoke

  # Publish to GHCR on a version tag only: a release is a deliberate act with
  # its own numbering (Makefile BUILD_NUMBER), never a side effect of a push to
  # main. The image is tagged with the git describe output and `latest`.
  publish:
    needs: [build-and-test, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          make docker-build
          docker push --all-tags ghcr.io/simpledcp/openaccessbridge
